services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: metro_db
      POSTGRES_USER: metro_user
      POSTGRES_PASSWORD: metro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro_user -d metro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://metro_user:metro_password@postgres:5432/metro_db
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
      - URL=http://localhost:8080/openapi.yaml
    volumes:
      - ./openapi/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres_data: