services:
  api:
    build: .
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./data.db:/app/data.db

  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
      - SWAGGER_JSON=/openapi/openapi.yaml
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
    ports:
      - "8080:8080"
    depends_on:
      - api