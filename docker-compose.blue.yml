version: '3.8'

services:
  postgres-blue:
    image: postgres:15-alpine
    container_name: metro-postgres-blue
    environment:
      POSTGRES_DB: metro_db
      POSTGRES_USER: metro_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:-prod_password_change_me}
    volumes:
      - postgres_blue_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - blue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro_user -d metro_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-blue:
    image: ${BLUE_IMAGE:-dernier-metro-api:blue}
    container_name: metro-api-blue
    environment:
      PORT: 5001
      DATABASE_URL: postgres://metro_user:${POSTGRES_PASSWORD_PROD:-prod_password_change_me}@postgres-blue:5432/metro_db
      NODE_ENV: production
    ports:
      - "5001:5001"
    networks:
      - blue-network
    depends_on:
      postgres-blue:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_blue_data:
    name: metro_postgres_blue_data

networks:
  blue-network:
    name: metro_blue_network
    driver: bridge