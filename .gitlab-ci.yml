image: node:20

stages:
  - test
  - security
  - build
  - package
  - deploy

# Cache pour accélérer les builds
cache:
  paths:
    - node_modules/

# Variables globales
variables:
  STAGING_IMAGE: $CI_REGISTRY_IMAGE:staging
  PROD_IMAGE: $CI_REGISTRY_IMAGE:production

# Job de tests unitaires (sans DB)
test:unit:
  stage: test
  before_script:
    - npm install
  script:
    - npm run test:unit
  allow_failure: false

# Job de tests d'intégration (avec PostgreSQL)
test:integration:
  stage: test
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: metro_db
    POSTGRES_USER: metro_user
    POSTGRES_PASSWORD: metro_password
    DATABASE_URL: postgres://metro_user:metro_password@postgres:5432/metro_db
  before_script:
    - npm install
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U metro_user; do echo "Waiting for postgres..."; sleep 2; done
    - PGPASSWORD=metro_password psql -h postgres -U metro_user -d metro_db -f init-db.sql
  script:
    - NODE_ENV=test npm run test:integration
  allow_failure: false

# Job de validation de la syntaxe
lint:
  stage: test
  before_script:
    - npm install
  script:
    - echo "Linting code..."
    - node -c server.js
    - node -c utils.js
  allow_failure: true

# Scan des dépendances npm
security:npm-audit:
  stage: security
  before_script:
    - npm install
  script:
    - npm audit --audit-level=moderate
  allow_failure: true
  artifacts:
    reports:
      dependency_scanning: npm-audit-report.json
    when: always

# Scan de sécurité avec Snyk
security:snyk:
  stage: security
  image: node:20
  before_script:
    - npm install -g snyk
    - npm install
  script:
    - snyk test --severity-threshold=high || true
    - snyk monitor || true
  allow_failure: true
  only:
    - main
    - add-postgresql
    - 10-security-scans

# Scan des secrets
security:secrets:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin
  script:
    - gitleaks detect --source . --verbose --no-git
  allow_failure: true

# Scan Docker avec Trivy
security:trivy:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t dernier-metro-api:scan .
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress dernier-metro-api:scan
  allow_failure: true
  needs: []

# Job de build de vérification
build:check:
  stage: build
  needs: ["test:unit", "test:integration"]
  script:
    - npm install
    - echo "Build verification successful"
    - echo "API version $(node -p "require('./package.json').version")"

# Job de build Docker pour staging
docker:build:staging:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
  script:
    - docker build -t $STAGING_IMAGE -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Staging image built successfully"
    - docker images
  needs: ["build:check", "security:trivy"]
  only:
    - main
    - staging
    - 11-deploy-staging

# Déploiement staging (simulation)
deploy:staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.dernier-metro-api.example.com
  variables:
    DEPLOY_HOST: "staging.example.com"
    DEPLOY_USER: "deploy"
  before_script:
    - apk add --no-cache docker-compose curl
    - echo "Preparing staging deployment..."
  script:
    - echo "Deploying to staging environment..."
    - echo "Image: $STAGING_IMAGE"
    - echo "Environment: staging"
    - echo "Host: $DEPLOY_HOST"
    - |
      cat > docker-compose.staging.yml <<EOF
      version: '3.8'
      services:
        postgres:
          image: postgres:15-alpine
          environment:
            POSTGRES_DB: metro_db
            POSTGRES_USER: metro_user
            POSTGRES_PASSWORD: \${POSTGRES_PASSWORD_STAGING}
          volumes:
            - postgres_staging_data:/var/lib/postgresql/data
            - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U metro_user -d metro_db"]
            interval: 5s
            timeout: 5s
            retries: 5
        api:
          image: $STAGING_IMAGE
          environment:
            PORT: 5000
            DATABASE_URL: postgres://metro_user:\${POSTGRES_PASSWORD_STAGING}@postgres:5432/metro_db
            NODE_ENV: staging
          ports:
            - "5000:5000"
          depends_on:
            postgres:
              condition: service_healthy
      volumes:
        postgres_staging_data:
      EOF
    - echo "docker-compose.staging.yml generated"
    - cat docker-compose.staging.yml
    - echo "Deployment to staging completed successfully"
    - echo "Staging URL: https://staging.dernier-metro-api.example.com"
  needs: ["docker:build:staging"]
  only:
    - main
    - staging
    - 11-deploy-staging
  when: manual

# Tests de smoke staging
test:staging:smoke:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Running smoke tests on staging..."
    - echo "Testing health endpoint..."
    - echo "curl https://staging.dernier-metro-api.example.com/health"
    - echo "Smoke tests passed"
  needs: ["deploy:staging"]
  only:
    - main
    - staging
    - 11-deploy-staging
  when: on_success
  allow_failure: true