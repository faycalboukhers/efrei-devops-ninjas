image: node:20

stages:
  - test
  - build

# Cache pour accélérer les builds
cache:
  paths:
    - node_modules/

# Job de tests unitaires
test:unit:
  stage: test
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run test:unit
  allow_failure: false

# Job de tests d'intégration
test:integration:
  stage: test
  before_script:
    - npm ci --prefer-offline
  script:
    - NODE_ENV=test npm run test:integration
  allow_failure: false

# Job de validation de la syntaxe
lint:
  stage: test
  before_script:
    - npm install
  script:
    - echo "Linting code..."
    - node -c server.js
    - node -c utils.js
  allow_failure: true

# Job de build de vérification
build:check:
  stage: build
  needs: ["test:unit", "test:integration"]
  script:
    - npm install
    - echo "Build verification successful"
    - echo "API version $(node -p "require('./package.json').version")"