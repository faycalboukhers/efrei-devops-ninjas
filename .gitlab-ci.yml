image: node:20

stages:
  - test
  - security
  - build
  - package
  - deploy
  - production

# Cache pour accélérer les builds
cache:
  paths:
    - node_modules/

# Variables globales
variables:
  STAGING_IMAGE: $CI_REGISTRY_IMAGE:staging
  BLUE_IMAGE: $CI_REGISTRY_IMAGE:blue
  GREEN_IMAGE: $CI_REGISTRY_IMAGE:green
  PROD_IMAGE: $CI_REGISTRY_IMAGE:production

# Job de tests unitaires
test:unit:
  stage: test
  before_script:
    - npm install
  script:
    - npm run test:unit
  allow_failure: false

# Job de tests d'intégration
test:integration:
  stage: test
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: metro_db
    POSTGRES_USER: metro_user
    POSTGRES_PASSWORD: metro_password
    DATABASE_URL: postgres://metro_user:metro_password@postgres:5432/metro_db
  before_script:
    - npm install
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U metro_user; do echo "Waiting for postgres..."; sleep 2; done
    - PGPASSWORD=metro_password psql -h postgres -U metro_user -d metro_db -f init-db.sql
  script:
    - NODE_ENV=test npm run test:integration
  allow_failure: false

# Job de validation de la syntaxe
lint:
  stage: test
  before_script:
    - npm install
  script:
    - echo "Linting code..."
    - node -c server.js
    - node -c utils.js
  allow_failure: true

# Scan des dépendances npm
security:npm-audit:
  stage: security
  before_script:
    - npm install
  script:
    - npm audit --audit-level=moderate
  allow_failure: true

# Scan des secrets
security:secrets:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin
  script:
    - gitleaks detect --source . --verbose --no-git
  allow_failure: true

# Scan Docker avec Trivy
security:trivy:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t dernier-metro-api:scan .
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress dernier-metro-api:scan
  allow_failure: true
  needs: []

# Job de build de vérification
build:check:
  stage: build
  needs: ["test:unit", "test:integration"]
  script:
    - npm install
    - echo "Build verification successful"
    - echo "API version $(node -p "require('./package.json').version")"

# Job de build Docker pour staging
docker:build:staging:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t $STAGING_IMAGE -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Staging image built successfully"
  needs: ["build:check", "security:trivy"]
  only:
    - main
    - staging
    - 11-deploy-staging
    - 12-prod-deployment

# Déploiement staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.dernier-metro-api.example.com
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    - echo "Image STAGING_IMAGE"
    - echo "Deployment to staging completed"
  needs: ["docker:build:staging"]
  only:
    - main
    - staging
    - 11-deploy-staging
    - 12-prod-deployment
  when: manual

# Tests smoke staging
test:staging:smoke:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Running smoke tests on staging..."
    - echo "Smoke tests passed"
  needs: ["deploy:staging"]
  only:
    - main
    - staging
    - 11-deploy-staging
    - 12-prod-deployment
  when: on_success
  allow_failure: true

# Build production Blue image
docker:build:blue:
  stage: production
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t $BLUE_IMAGE .
    - docker tag $BLUE_IMAGE $PROD_IMAGE
    - echo "Blue (production) image built successfully"
    - docker images | grep dernier-metro
  needs: ["test:staging:smoke"]
  only:
    - main
    - 12-prod-deployment
  when: manual

# Build production Green image
docker:build:green:
  stage: production
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t $GREEN_IMAGE .
    - echo "Green (production) image built successfully"
    - docker images | grep dernier-metro
  needs: ["test:staging:smoke"]
  only:
    - main
    - 12-prod-deployment
  when: manual


# Déploiement Blue
deploy:blue:
  stage: production
  image: alpine:latest
  environment:
    name: production-blue
    url: https://api.dernier-metro-api.example.com
  before_script:
    - apk add --no-cache curl
  script:
    - echo "===== BLUE DEPLOYMENT ====="
    - echo "Deploying BLUE environment to production..."
    - echo "Image BLUE_IMAGE"
    - echo "BLUE environment is now ACTIVE on port 5001"
  needs: ["docker:build:blue"]
  only:
    - main
    - 12-prod-deployment
  when: manual

# Déploiement Green
deploy:green:
  stage: production
  image: alpine:latest
  environment:
    name: production-green
    url: https://green.dernier-metro-api.example.com
  before_script:
    - apk add --no-cache curl
  script:
    - echo "===== GREEN DEPLOYMENT ====="
    - echo "Deploying GREEN environment to production..."
    - echo "Image GREEN_IMAGE"
    - echo "GREEN environment deployed on port 5002 (standby)"
  needs: ["docker:build:green"]
  only:
    - main
    - 12-prod-deployment
  when: manual

  
# Switch production traffic (Blue to Green or Green to Blue)
deploy:switch:
  stage: production
  image: alpine:latest
  environment:
    name: production
    url: https://api.dernier-metro-api.example.com
  script:
    - echo "===== SWITCHING PRODUCTION TRAFFIC ====="
    - echo "This job simulates switching the load balancer"
    - echo "In a real setup, this would:"
    - echo "1. Update load balancer configuration"
    - echo "2. Route traffic to the new environment"
    - echo "3. Keep old environment running for rollback"
    - echo ""
    - echo "Example nginx config update:"
    - |
      cat > nginx-upstream.conf <<EOF
      upstream api_backend {
          # Switch between these two lines to change active environment
          server api-blue:5001;  # Currently ACTIVE
          # server api-green:5002;  # Standby
      }
      EOF
    - cat nginx-upstream.conf
    - echo ""
    - echo "Traffic switch completed!"
    - echo "Monitor metrics and rollback if needed"
  needs: ["deploy:blue", "deploy:green"]
  only:
    - main
    - 12-prod-deployment
  when: manual