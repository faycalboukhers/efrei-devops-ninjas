image: node:20

stages:
  - test
  - build
  - package

# Cache pour accélérer les builds
cache:
  paths:
    - node_modules/

# Job de tests unitaires
test:unit:
  stage: test
  before_script:
    - npm install
  script:
    - npm run test:unit
  allow_failure: false

# Job de tests d'intégration
test:integration:
  stage: test
  before_script:
    - npm install
  script:
    - NODE_ENV=test npm run test:integration
  allow_failure: false

# Job de validation de la syntaxe
lint:
  stage: test
  before_script:
    - npm install
  script:
    - echo "Linting code..."
    - node -c server.js
    - node -c utils.js
  allow_failure: true

# Job de build de vérification
build:check:
  stage: build
  needs: ["test:unit", "test:integration"]
  script:
    - npm install
    - echo "Build verification successful"
    - echo "API version $(node -p "require('./package.json').version")"

# Job de build Docker
docker:build:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker info
    - echo "Building Docker image for commit $CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker images
    - echo "Docker image built successfully"
    - docker run --rm $IMAGE_TAG node --version
  needs: ["build:check"]
  only:
    - branches
  except:
    - tags