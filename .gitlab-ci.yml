image: node:20

stages:
  - test
  - security
  - build
  - package

# Cache pour accélérer les builds
cache:
  paths:
    - node_modules/

# Job de tests unitaires (sans DB)
test:unit:
  stage: test
  before_script:
    - npm install
  script:
    - npm run test:unit
  allow_failure: false

# Job de tests d'intégration (avec PostgreSQL)
test:integration:
  stage: test
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: metro_db
    POSTGRES_USER: metro_user
    POSTGRES_PASSWORD: metro_password
    DATABASE_URL: postgres://metro_user:metro_password@postgres:5432/metro_db
  before_script:
    - npm install
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U metro_user; do echo "Waiting for postgres..."; sleep 2; done
    - PGPASSWORD=metro_password psql -h postgres -U metro_user -d metro_db -f init-db.sql
  script:
    - NODE_ENV=test npm run test:integration
  allow_failure: false

# Job de validation de la syntaxe
lint:
  stage: test
  before_script:
    - npm install
  script:
    - echo "Linting code..."
    - node -c server.js
    - node -c utils.js
  allow_failure: true

# Scan des dépendances npm
security:npm-audit:
  stage: security
  before_script:
    - npm install
  script:
    - npm audit --audit-level=moderate
  allow_failure: true
  artifacts:
    reports:
      dependency_scanning: npm-audit-report.json
    when: always

# Scan de sécurité avec Snyk (alternative à npm audit)
security:snyk:
  stage: security
  image: node:20
  before_script:
    - npm install -g snyk
    - npm install
  script:
    - snyk test --severity-threshold=high || true
    - snyk monitor || true
  allow_failure: true
  only:
    - main
    - add-postgresql

# Scan des secrets (détection de clés API, passwords, etc.)
security:secrets:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose --no-git
  allow_failure: true

# Scan Docker avec Trivy
security:trivy:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t dernier-metro-api:scan .
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress dernier-metro-api:scan
  allow_failure: true
  needs: []

# Job de build de vérification
build:check:
  stage: build
  needs: ["test:unit", "test:integration"]
  script:
    - npm install
    - echo "Build verification successful"
    - echo "API version $(node -p "require('./package.json').version")"

# Job de build Docker
docker:build:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker info
    - echo "Building Docker image for commit $CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker images
    - echo "Docker image built successfully"
    - docker run --rm $IMAGE_TAG node --version
  needs: ["build:check", "security:trivy"]
  only:
    - branches
  except:
    - tags