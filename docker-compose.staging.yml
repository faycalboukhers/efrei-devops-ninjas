version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: metro_db
      POSTGRES_USER: metro_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING:-staging_password_change_me}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro_user -d metro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${STAGING_IMAGE:-dernier-metro-api:staging}
    environment:
      PORT: 5000
      DATABASE_URL: postgres://metro_user:${POSTGRES_PASSWORD_STAGING:-staging_password_change_me}@postgres:5432/metro_db
      NODE_ENV: staging
    ports:
      - "5000:5000"
    networks:
      - staging-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
      - URL=http://localhost:8080/openapi.yaml
    volumes:
      - ./openapi/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - staging-network
    depends_on:
      - api

volumes:
  postgres_staging_data:

networks:
  staging-network:
    driver: bridge